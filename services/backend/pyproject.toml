[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.121.1",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-env>=1.0.0",
    "httpx>=0.26.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.34.0",
    "ty>=0.0.26",
]

[tool.uv]
exclude-newer = "7 days"
